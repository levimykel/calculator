<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No scale locking: it can affect how iOS sizes a standalone web view, and
     pinch-zoom is held off with touch-action instead (see .app in styles.css). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcutron</title>
<meta name="description" content="Calcutron — a friendly little calculator that works offline.">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/calcutron.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Home-screen install on iOS -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Not black-translucent. With that, iOS positions the web view at the top of
     the screen but sizes it as though it started below the status bar, so the
     missing height falls off the bottom and cannot be painted. "black" makes
     the view start below the status bar, where its height then reaches the
     screen bottom. iOS reads this at install time, so changing it needs a
     delete-and-re-add to take effect. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Calcutron">

<link rel="stylesheet" href="css/styles.css">
<script src="version.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <img class="mark" src="icons/calcutron.svg" alt="" width="30" height="30">
    <h1>Calcutron</h1>
    <button class="chip chip--icon" id="soundToggle" type="button" data-level="soft" aria-label="Key sounds: soft. Tap for louder.">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="icon__speaker" d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/>
        <path class="icon__wave-in" d="M15.4 9a4.2 4.2 0 0 1 0 6"/>
        <path class="icon__wave-out" d="M18 6.6a7.6 7.6 0 0 1 0 10.8"/>
        <path class="icon__cross" d="M15.8 9.8l4.4 4.4M20.2 9.8l-4.4 4.4"/>
      </svg>
    </button>
    <button class="chip" id="versionChip" type="button" aria-live="polite">v3.6.0</button>
  </header>

  <p class="diag" id="diag" hidden></p>

  <section class="history" aria-label="History">
    <div class="history__bar">
      <button class="history__toggle" id="expandHistory" type="button" hidden aria-expanded="false" aria-label="Show more history">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9.5l6 6 6-6"/></svg>
      </button>
      <button class="history__clear" id="clearHistory" type="button" hidden>Clear</button>
    </div>
    <div class="history__scroll" id="historyScroll">
      <ol class="history__list" id="historyList"></ol>
      <p class="history__empty" id="historyEmpty">Calculations you finish will collect here.</p>
    </div>
  </section>

  <section class="display">
    <output class="result" id="result" aria-label="Result" aria-live="polite" aria-atomic="true">0</output>
    <div class="entryline" id="entryLine" aria-label="Expression"></div>
  </section>

  <div class="keypad" id="keypad">
    <button class="key key--fn" data-action="negate" aria-label="Toggle sign">±</button>
    <button class="key key--fn" data-action="openParen" aria-label="Open parenthesis">(</button>
    <button class="key key--fn" data-action="closeParen" aria-label="Close parenthesis">)</button>
    <button class="key key--fn key--star" id="starKey" data-action="star" data-on="false" aria-label="Star the last calculation">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>
      </svg>
    </button>

    <button class="key" data-action="digit" data-digit="7">7</button>
    <button class="key" data-action="digit" data-digit="8">8</button>
    <button class="key" data-action="digit" data-digit="9">9</button>
    <button class="key key--op" data-action="operator" data-op="divide" aria-label="Divide">÷</button>

    <button class="key" data-action="digit" data-digit="4">4</button>
    <button class="key" data-action="digit" data-digit="5">5</button>
    <button class="key" data-action="digit" data-digit="6">6</button>
    <button class="key key--op" data-action="operator" data-op="multiply" aria-label="Multiply">×</button>

    <button class="key" data-action="digit" data-digit="1">1</button>
    <button class="key" data-action="digit" data-digit="2">2</button>
    <button class="key" data-action="digit" data-digit="3">3</button>
    <button class="key key--op" data-action="operator" data-op="subtract" aria-label="Subtract">−</button>

    <button class="key" data-action="digit" data-digit="0">0</button>
    <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
    <button class="key" data-action="percent" aria-label="Percent">%</button>
    <button class="key key--op key--tall" data-action="operator" data-op="add" aria-label="Add">+</button>

    <button class="key key--clear" id="clearKey" data-action="clearOrBack" data-mode="clear" aria-label="All clear">
      <span class="key__label">C</span>
      <svg class="key__glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M8 5h12v14H8L2 12z"/>
        <path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>
      </svg>
    </button>
    <button class="key key--eq key--wide" data-action="equals" aria-label="Equals">=</button>
  </div>

<script type="module" src="js/app.js"></script>
</body>
</html>
